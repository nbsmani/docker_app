services:
  app:
    image: etl
    volumes:
      - ./output:/app/output
    depends_on:
      - postgres
    networks:
      - de-network
    command: ["process_data.py","batch1.csv"]
  app2:
    image: etl
    volumes:
      - ./output:/app/output
    depends_on:
      - postgres
    networks:
      - de-network
    command: ["process_data.py","batch2.csv"]
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: mydata
      POSTGRES_USER: balu
      POSTGRES_PASSWORD: bn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - de-network
  spark-master:
    image: apache/spark:3.5.0
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "7077:7077"
      - "8080:8080"
    networks:
      - de-network
  dashboard:
    image: etl
    ports: 
      - 8501:8501
    depends_on:
      - postgres
    networks:
      - de-network
    command: ["-m", "streamlit", "run", "dashboard.py", "--server.port=8501", "--server.address=0.0.0.0"]

volumes:
  pgdata:

networks:
  de-network:
    external: true
