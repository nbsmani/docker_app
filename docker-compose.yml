services:
  app:
    image: etl
    volumes:
      - ./output:/app/output
    depends_on:
      - postgres
    deploy:
      replicas: 2
    networks:
      - my-network
    command: ["batch1.csv"]
  app2:
    image: etl
    volumes:
      - ./output:/app/output
    depends_on:
      - postgres
    networks:
      - my-network
    command: ["batch2.csv"]
  postgres:
    image: postgres:13
    environment:
      POSTGRES_DB: mydata
      POSTGRES_USER: balu
      POSTGRES_PASSWORD: bn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - my-network
volumes:
  pgdata:
networks:
  my-network:
    driver: bridge
